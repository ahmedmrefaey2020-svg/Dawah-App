const STORIES=[["آدم عليه السلام", "أبو البشر؛ خلقه الله وأسجد له الملائكة، فسكن الجنة ثم هبط إلى الأرض بعد الخطأ والتوبة.", "2,7,20,38", "أخبر الله الملائكة أنه جاعل في الأرض خليفة، فتساءلوا عن الإفساد وسفك الدماء، فقال: ﴿إني أعلم ما لا تعلمون﴾. خلق الله آدم من طين ونفخ فيه من روحه وعلّمه الأسماء كلها، ثم عرضها على الملائكة فقالوا: لا علم لنا إلا ما علّمتنا، فأنبأهم آدم بأسمائها فظهر فضله.\nأمر الله الملائكة بالسجود لآدم تكريمًا له، فسجدوا إلا إبليس أبى واستكبر وقال: أنا خير منه خلقتني من نار وخلقته من طين، فطُرد من رحمة الله، وسأل الإنظار إلى يوم يُبعثون فأُنظر، وتوعّد بإغواء بني آدم.\nأسكن الله آدم وزوجه الجنة وأباح لهما كل شيء إلا شجرة واحدة، فوسوس لهما الشيطان وأقسم لهما إنه لهما لمن الناصحين، وزعم أنها شجرة الخلد، فأكلا منها فبدت لهما سوآتهما وطفقا يخصفان عليهما من ورق الجنة. فتلقّى آدم من ربه كلمات فتاب الله عليه: ﴿ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين﴾، ثم أهبطهم إلى الأرض ووعدهم بهدى من عنده.\nالعبرة: التوبة سبيل النجاة، وعداوة الشيطان للإنسان قائمة فلا يُغتر بوسوسته."], ["نوح عليه السلام", "دعا قومه ألف سنة إلا خمسين عامًا، وصنع السفينة بأمر الله ونجّاه مع المؤمنين من الطوفان.", "7,11,23,71", "أرسل الله نوحًا إلى قومه يدعوهم إلى عبادة الله وحده، فمكث فيهم ألف سنة إلا خمسين عامًا يدعوهم ليلًا ونهارًا وسرًّا وجهرًا، وكانوا يعبدون ودًّا وسواعًا ويغوث ويعوق ونسرًا. ولم يؤمن به إلا قليل من الضعفاء، وسخر الملأ منه واتهموه بالضلال وقالوا: ما نراك إلا بشرًا مثلنا وما نراك اتبعك إلا أراذلنا.\nفلما يئس من قومه دعا ربه أنه مغلوب فانتصر، فأوحى الله إليه أن يصنع السفينة بأعيننا ووحينا، فكان قومه يمرون به ويسخرون منه. ثم جاء أمر الله وفار التنور فحمل في السفينة من كل زوجين اثنين وأهله إلا من سبق عليه القول ومن آمن، وجرت بهم في موج كالجبال.\nونادى نوح ابنه وكان في معزل: يا بني اركب معنا ولا تكن مع الكافرين، فقال: سآوي إلى جبل يعصمني من الماء، فقال: لا عاصم اليوم من أمر الله إلا من رحم، وحال بينهما الموج فكان من المغرقين. ثم قيل: يا أرض ابلعي ماءك ويا سماء أقلعي، وغاض الماء واستوت السفينة على الجودي. وسأل نوح ربه عن ابنه فبيّن له الله أنه ليس من أهله لأنه عمل غير صالح.\nالعبرة: الصبر الطويل على الدعوة، ولا ينفع النسب مع الكفر."], ["هود عليه السلام", "أرسله الله إلى عاد أصحاب القوة والبنيان، فكذّبوه فأهلكهم الله بريح صرصر عاتية.", "7,11,26,46", "أرسل الله إلى عاد أخاهم هودًا، وكانوا أمة قوية الأجساد زادهم الله بسطة في الخلق، يبنون بكل ريع آية يعبثون ويتخذون مصانع لعلهم يخلدون، وإذا بطشوا بطشوا جبارين. دعاهم هود إلى عبادة الله وحده وتقواه وشكر نعمه، فاتهموه بالسفاهة وقالوا: ما جئتنا ببينة وما نحن بتاركي آلهتنا عن قولك، وقالوا: ائتنا بما تعدنا إن كنت من الصادقين.\nفتبرأ هود من شركهم وتوكل على الله، ثم جاءهم العذاب: رأوه عارضًا مستقبل أوديتهم فقالوا هذا عارض ممطرنا، فإذا هو ريح فيها عذاب أليم سخّرها الله عليهم سبع ليال وثمانية أيام حسومًا، فتركتهم صرعى كأنهم أعجاز نخل خاوية. ونجّى الله هودًا والذين آمنوا معه برحمة منه.\nالعبرة: القوة المادية لا تغني عن الإيمان وشكر النعمة."], ["صالح عليه السلام", "أرسله الله إلى ثمود، وجعل لهم ناقة آية، فعقروها فأخذتهم الصيحة.", "7,11,26,91", "أرسل الله إلى ثمود أخاهم صالحًا، وكانوا ينحتون من الجبال بيوتًا ويتخذون من سهولها قصورًا. دعاهم إلى التوحيد فطلبوا آية، فأخرج الله لهم ناقة آية، لها شِرب ولهم شِرب يوم معلوم، وحذّرهم أن يمسّوها بسوء.\nوكان في المدينة تسعة رهط يفسدون في الأرض ولا يصلحون، فعقروا الناقة وعتوا عن أمر ربهم وقالوا: يا صالح ائتنا بما تعدنا إن كنت من المرسلين. فقال: تمتعوا في داركم ثلاثة أيام ذلك وعد غير مكذوب. فأخذتهم الصيحة فأصبحوا في ديارهم جاثمين، ونجا صالح والذين آمنوا معه.\nالعبرة: عاقبة التعدّي على حدود الله وآياته."], ["إبراهيم عليه السلام", "خليل الله؛ حطّم الأصنام، ونجّاه الله من النار، وبنى الكعبة مع ابنه إسماعيل.", "2,6,14,19,21,37", "نشأ إبراهيم في قوم يعبدون الأصنام وكان أبوه آزر منهم، فدعاه بالحسنى: يا أبت لِمَ تعبد ما لا يسمع ولا يبصر؟ وتأمل في الكواكب والقمر والشمس فرآها آفلة وقال: لا أحب الآفلين، ثم أعلن أنه وجّه وجهه للذي فطر السماوات والأرض حنيفًا. وناظر قومه ثم دبّر لأصنامهم فجعلها جذاذًا إلا كبيرًا لهم لعلهم إليه يرجعون، فلما سألوه قال: بل فعله كبيرهم هذا فاسألوهم إن كانوا ينطقون، فرجعوا إلى أنفسهم ثم نُكسوا على رؤوسهم.\nفأوقدوا نارًا وألقوه فيها فقال الله: ﴿يا نار كوني بردًا وسلامًا على إبراهيم﴾. وحاجّه الذي آتاه الله الملك في ربه فقال إبراهيم: ربي الذي يحيي ويميت، قال: أنا أحيي وأميت، فقال إبراهيم: فإن الله يأتي بالشمس من المشرق فأتِ بها من المغرب، فبُهت الذي كفر.\nثم هاجر ورزقه الله إسماعيل ثم إسحاق، وأسكن هاجر وإسماعيل بواد غير ذي زرع عند بيت الله المحرم. وابتلاه الله برؤيا ذبح ابنه، فقال إسماعيل: يا أبت افعل ما تؤمر ستجدني إن شاء الله من الصابرين، فلما أسلما وتلّه للجبين فداه الله بذبح عظيم. ثم رفع إبراهيم وإسماعيل قواعد البيت يقولان: ربنا تقبل منا إنك أنت السميع العليم.\nالعبرة: التوحيد الخالص والتسليم لأمر الله."], ["لوط عليه السلام", "أرسله الله إلى قوم يأتون الفاحشة، فنجّاه وأهله إلا امرأته وأهلك قومه بحجارة من سجّيل.", "7,11,15,26,27", "أرسل الله لوطًا إلى قوم يأتون الفاحشة ما سبقهم بها من أحد من العالمين، يأتون الرجال شهوة من دون النساء ويقطعون السبيل ويأتون في ناديهم المنكر. دعاهم إلى تقوى الله وترك الفاحشة فلم يكن جوابهم إلا أن قالوا: أخرجوهم من قريتكم إنهم أناس يتطهرون.\nوجاءته الملائكة في صورة ضيوف فضاق بهم ذرعًا، وجاءه قومه يهرعون إليه فأرشدهم إلى الحلال فأبوا. فقالت الملائكة: يا لوط إنا رسل ربك لن يصلوا إليك، فأسرِ بأهلك بقطع من الليل ولا يلتفت منكم أحد إلا امرأتك إنه مصيبها ما أصابهم. فلما جاء أمرنا جعلنا عاليها سافلها وأمطرنا عليها حجارة من سجّيل منضود، وكانت امرأته من الغابرين لأنها خانته بالكفر وموالاة قومه.\nالعبرة: خطورة الفاحشة، ولا ينفع قرب النبي لمن كفر."], ["شعيب عليه السلام", "أرسله الله إلى مدين الذين كانوا يطفّفون المكيال والميزان، فأهلكهم الله بعد تكذيبهم.", "7,11,26,29", "أرسل الله إلى مدين أخاهم شعيبًا، وكانوا يطفّفون المكيال والميزان ويبخسون الناس أشياءهم ويقعدون بكل صراط يوعدون ويصدّون عن سبيل الله. دعاهم إلى التوحيد والعدل في الكيل والوزن وذكّرهم بأنهم كانوا قليلًا فكثّرهم الله.\nفقال الملأ: لنخرجنك يا شعيب والذين آمنوا معك من قريتنا أو لتعودنّ في ملتنا، وقالوا: أصلاتك تأمرك أن نترك ما يعبد آباؤنا أو أن نفعل في أموالنا ما نشاء؟ فأجاب: إن أريد إلا الإصلاح ما استطعت وما توفيقي إلا بالله. فأخذتهم الرجفة فأصبحوا في دارهم جاثمين، وذكر القرآن في مواضع أخرى أنها صيحة وأنه عذاب يوم الظلة.\nالعبرة: الأمانة والعدل في المعاملات."], ["يوسف عليه السلام", "رؤيا الطفولة، فالجبّ، ثم بيت العزيز والسجن، وأخيرًا التمكين ولمّ شمل الأسرة.", "12", "رأى يوسف وهو صغير أحد عشر كوكبًا والشمس والقمر له ساجدين، فقال له أبوه يعقوب: لا تقصص رؤياك على إخوتك فيكيدوا لك كيدًا. وغار إخوته لحب أبيهم له فقالوا: أرسله معنا غدًا يرتع ويلعب، فألقوه في غيابة الجب وجاؤوا أباهم عشاءً يبكون بقميص عليه دم كذب، فقال: بل سوّلت لكم أنفسكم أمرًا فصبر جميل.\nالتقطته سيّارة فباعوه بثمن بخس دراهم معدودة، واشتراه عزيز مصر وقال لامرأته: أكرمي مثواه عسى أن ينفعنا. ولما كبر راودته امرأة العزيز عن نفسه وغلّقت الأبواب فقال: معاذ الله إنه ربي أحسن مثواي، واستبقا الباب وقدّت قميصه من دبر، وشهد شاهد من أهلها. ثم تحدّث النسوة فجمعتهن وقطّعن أيديهن لجماله، فاستعصم، ودخل السجن. وفي السجن عبّر رؤيا صاحبيه ودعا إلى التوحيد.\nوبعد سنين رأى الملك سبع بقرات سمان يأكلهن سبع عجاف فعبّرها يوسف بسبع سنين دأبًا ثم سبع شداد ثم عام فيه يُغاث الناس، وأشار بالادّخار. فأبى الخروج حتى تُبرَّأ ساحته، فقالت امرأة العزيز: أنا راودته عن نفسه وإنه لمن الصادقين. وجعله الملك على خزائن الأرض فقال: ﴿اجعلني على خزائن الأرض إني حفيظ عليم﴾.\nوجاء إخوته يمتارون فعرفهم وهم له منكرون، ثم عرّفهم بنفسه: أنا يوسف وهذا أخي، فقالوا: تالله لقد آثرك الله علينا وإن كنا لخاطئين، فقال: ﴿لا تثريب عليكم اليوم يغفر الله لكم﴾. وأرسل قميصه فارتدّ أبوه بصيرًا، وجاؤوا بأهلهم أجمعين، ورفع أبويه على العرش وخرّوا له سجّدًا فقال: يا أبت هذا تأويل رؤياي من قبل قد جعلها ربي حقًّا.\nالعبرة: الصبر والعفة والعفو، وأن عاقبة الصابرين التمكين."], ["موسى عليه السلام", "وُلد في زمن فرعون، وكلّمه الله، وشقّ له البحر، وقاد بني إسرائيل.", "7,20,26,28", "وُلد موسى في زمن فرعون الذي علا في الأرض وجعل أهلها شِيَعًا يستضعف طائفة منهم يذبّح أبناءهم ويستحيي نساءهم. فأوحى الله إلى أم موسى أن أرضعيه فإذا خفتِ عليه فألقيه في اليم ولا تخافي ولا تحزني إنا رادّوه إليك وجاعلوه من المرسلين. فالتقطه آل فرعون وقالت امرأة فرعون: قرة عين لي ولك لا تقتلوه، وحرّم الله عليه المراضع فرجع إلى أمه لتقرّ عينها.\nولما بلغ أشدّه آتاه الله حكمًا وعلمًا، ووكز رجلًا من عدوهم فقضى عليه، فاستغفر ربه فغفر له، وخرج من المدينة خائفًا يترقب، فورد ماء مدين وسقى لابنتي الرجل الصالح، وعمل عنده ثماني حجج وتزوج إحداهما. وفي طريق عودته رأى نارًا بجانب الطور فنودي: إني أنا ربك فاخلع نعليك إنك بالواد المقدس طوى، وأعطاه الله آية العصا واليد البيضاء، وأرسله إلى فرعون مع أخيه هارون.\nفكذّب فرعون وجمع السحرة فألقوا حبالهم وعصيّهم، فألقى موسى عصاه فإذا هي تلقف ما يأفكون، فخرّ السحرة ساجدين: آمنا برب هارون وموسى. وتتابعت الآيات على فرعون وقومه، ثم أمر الله موسى أن يسري بعباده ليلًا فلحقهم فرعون وجنوده، فقال أصحاب موسى: إنا لمدركون، قال: ﴿كلا إن معي ربي سيهدين﴾. فأوحى الله إليه أن اضرب بعصاك البحر فانفلق فكان كل فرق كالطود العظيم، فنجا موسى ومن معه وأُغرق فرعون وجنوده، وقال حين أدركه الغرق: آمنت أنه لا إله إلا الذي آمنت به بنو إسرائيل، فقيل: آلآن وقد عصيت قبل؟\nثم واعد الله موسى ثلاثين ليلة وأتمّها بعشر، وكلّمه ربه وآتاه التوراة، وفي غيابه اتخذ قومه العجل. وبعد ذلك أمرهم بدخول الأرض المقدسة فقالوا: اذهب أنت وربك فقاتلا إنا ههنا قاعدون، فتاهوا في الأرض أربعين سنة.\nالعبرة: النصر لمن توكل على الله، والظلم إلى زوال."], ["أصحاب الكهف", "فتية آمنوا بربهم ففرّوا بدينهم إلى كهف، فنامهم الله سنين ثم بعثهم آية.", "18", "فتية آمنوا بربهم وزادهم الله هدى، وكانوا في قوم يعبدون غير الله. ربط الله على قلوبهم فقاموا وقالوا: ربنا رب السماوات والأرض لن ندعو من دونه إلهًا لقد قلنا إذًا شططًا. فاعتزلوا قومهم وما يعبدون وأووا إلى الكهف، ووعدهم الله بنشر الرحمة والتيسير.\nضرب الله على آذانهم في الكهف سنين عددًا، وتزاور الشمس عن كهفهم ذات اليمين إذا طلعت وتقرضهم ذات الشمال، ونقلّبهم ذات اليمين وذات الشمال وكلبهم باسط ذراعيه بالوصيد. ثم بعثهم الله ليتساءلوا بينهم: كم لبثتم؟ قالوا: لبثنا يومًا أو بعض يوم، ثم قالوا ربكم أعلم بما لبثتم، فأرسلوا أحدهم بورقهم إلى المدينة وأمروه أن يتلطف ولا يشعرنّ بهم أحدًا.\nفانكشف أمرهم وأعثر الله عليهم الناس ليعلموا أن وعد الله حق وأن الساعة لا ريب فيها، وقد لبثوا في كهفهم ثلاثمئة سنين وازدادوا تسعًا.\nالعبرة: الفرار بالدين عند الفتنة، وقدرة الله على البعث."], ["ذو القرنين", "ملك صالح مكّن الله له في الأرض، فبلغ المغرب والمشرق وبنى السدّ ضد يأجوج ومأجوج.", "18", "ملك صالح مكّن الله له في الأرض وآتاه من كل شيء سببًا. سار نحو المغرب حتى بلغ مغرب الشمس فوجدها تغرب في عين حمئة، ووجد عندها قومًا، فقال الله: إما أن تعذّب وإما أن تتخذ فيهم حسنًا، فقال: أما من ظلم فسوف نعذبه ثم يُردّ إلى ربه فيعذبه عذابًا نُكرًا، وأما من آمن وعمل صالحًا فله جزاء الحسنى. ثم سار نحو المشرق حتى بلغ مطلع الشمس فوجدها تطلع على قوم لم يجعل لهم من دونها سترًا.\nثم سار حتى بلغ بين السدّين فوجد من دونهما قومًا لا يكادون يفقهون قولًا، فشكوا إليه إفساد يأجوج ومأجوج وعرضوا أن يجعلوا له خرجًا، فقال: ما مكّني فيه ربي خير فأعينوني بقوة أجعل بينكم وبينهم ردمًا. آتوني زبر الحديد، حتى إذا ساوى بين الصدفين قال انفخوا، حتى إذا جعله نارًا قال آتوني أفرغ عليه قِطرًا، فما استطاعوا أن يظهروه وما استطاعوا له نقبًا. وقال: هذا رحمة من ربي فإذا جاء وعد ربي جعله دكّاء وكان وعد ربي حقًّا.\nالعبرة: القوة مع الصلاح والتواضع ونسبة الفضل إلى الله."], ["مريم وعيسى عليهما السلام", "اصطفاء مريم، وميلاد عيسى بمعجزة، ودعوته إلى التوحيد.", "3,5,19", "اصطفى الله مريم وطهّرها، ونذرتها أمها امرأة عمران لله، وكفلها زكريا وكان يجد عندها رزقًا. ولما انتبذت من أهلها مكانًا شرقيًا أرسل الله إليها جبريل في صورة بشر سويّ فقالت: إني أعوذ بالرحمن منك إن كنت تقيًّا، فقال: إنما أنا رسول ربك لأهب لك غلامًا زكيًّا. قالت: أنّى يكون لي غلام ولم يمسسني بشر ولم أك بغيًّا؟ قال: كذلك قال ربك هو عليّ هيّن.\nفحملته فانتبذت به مكانًا قصيًّا، فأجاءها المخاض إلى جذع النخلة فقالت: يا ليتني متّ قبل هذا وكنت نسيًا منسيًّا، فناداها من تحتها ألا تحزني قد جعل ربك تحتك سريًّا، وهزّي إليك بجذع النخلة تساقط عليك رطبًا جنيًّا. وأمرت أن تقول إني نذرت للرحمن صومًا فلن أكلم اليوم إنسيًّا. فأتت به قومها تحمله فقالوا: يا أخت هارون ما كان أبوك امرأ سوء وما كانت أمك بغيًّا، فأشارت إليه، فقال: ﴿إني عبد الله آتاني الكتاب وجعلني نبيًّا﴾.\nوبُعث عيسى إلى بني إسرائيل بالإنجيل مصدّقًا لما بين يديه من التوراة، وأيّده الله بمعجزات: يخلق من الطين كهيئة الطير فينفخ فيه فيكون طيرًا بإذن الله، ويُبرئ الأكمه والأبرص ويحيي الموتى بإذن الله وينبّئهم بما يأكلون وما يدّخرون في بيوتهم. وآمن به الحواريون وقالوا نحن أنصار الله، ومكر الذين كفروا ومكر الله، وما قتلوه وما صلبوه ولكن شُبّه لهم، وإن الله رفعه إليه.\nالعبرة: عيسى عبد الله ورسوله، وقدرة الله في الخلق بلا حدود."], ["يونس عليه السلام", "صاحب الحوت؛ ناداه في الظلمات فاستجاب الله له ونجّاه، وآمن قومه.", "10,21,37,68", "ذو النون يونس عليه السلام أُرسل إلى قومه فدعاهم فلم يؤمنوا، فخرج مغاضبًا ظانًّا أن لن نقدر عليه، أي لن نضيّق عليه، فركب سفينة مشحونة فساهم فكان من المدحضين، فالتقمه الحوت وهو مليم. فنادى في الظلمات: ﴿أن لا إله إلا أنت سبحانك إني كنت من الظالمين﴾، فاستجاب الله له ونجّاه من الغمّ، ونبذه بالعراء وهو سقيم، وأنبت عليه شجرة من يقطين، وأرسله إلى مئة ألف أو يزيدون فآمنوا فمتّعهم الله إلى حين.\nوذكر القرآن أن قومه آمنوا لما رأوا العذاب فكشفه الله عنهم، ولم يقع ذلك لقرية غيرهم.\nالعبرة: التسبيح عند الكرب، والصبر على الدعوة وعدم مغادرة الميدان قبل إذن الله."], ["أيوب عليه السلام", "نبي صابر ابتلاه الله في جسده وماله وأهله فصبر فشفاه الله وعوّضه.", "21,38", "ابتلى الله أيوب في جسده وماله وأهله فصبر صبرًا جميلًا، حتى نادى ربه: ﴿أني مسني الضر وأنت أرحم الراحمين﴾، فاستجاب الله له وقال: اركض برجلك هذا مغتسل بارد وشراب، فشفاه، وآتاه أهله ومثلهم معهم رحمة منا وذكرى للعابدين. وأمره أن يأخذ بيده ضغثًا فيضرب به ولا يحنث، ثم قال الله: إنا وجدناه صابرًا نعم العبد إنه أوّاب.\nالعبرة: الصبر عند البلاء، والدعاء بأدب، وأن الفرج بيد الله."], ["داود وسليمان عليهما السلام", "نبيان ملكان؛ سُخّرت لهما الجبال والطير والريح والجن، وقصة الهدهد وملكة سبأ.", "21,27,34,38", "آتى الله داود الملك والحكمة وفصل الخطاب، وألان له الحديد وعلّمه صنعة لَبوس ليحصّنكم من بأسكم، وسخّر معه الجبال يسبّحن والطير، وآتاه الزبور. وقتل جالوت في قتال طالوت. وفي قصة الخصمين اللذين تسوّرا المحراب ظنّ داود أنما فتنّاه فاستغفر ربه وخرّ راكعًا وأناب.\nوورثه سليمان ملكه فعلّمه الله منطق الطير وسخّر له الريح غدوّها شهر ورواحها شهر وأسال له عين القِطر وسخّر له الجن، وحُشر له جنوده من الجن والإنس والطير فهم يوزعون. ومرّ بوادي النمل فقالت نملة: يا أيها النمل ادخلوا مساكنكم لا يحطمنّكم سليمان وجنوده وهم لا يشعرون، فتبسّم ضاحكًا من قولها وقال: رب أوزعني أن أشكر نعمتك.\nوتفقّد الهدهد فجاءه بنبأ يقين عن امرأة تملكهم هي ملكة سبأ، وهم يسجدون للشمس من دون الله، فكتب إليها كتابًا: إنه من سليمان وإنه بسم الله الرحمن الرحيم ألا تعلوا عليّ وأتوني مسلمين. فاستشارت قومها وأرسلت إليه هدية فردّها، وجاءها بعرشها قبل أن يرتدّ إليه طرفه، ثم دخلت الصرح فحسبته لُجّة وكشفت عن ساقيها فقيل: إنه صرح ممرّد من قوارير، فقالت: رب إني ظلمت نفسي وأسلمت مع سليمان لله رب العالمين. ومات سليمان متكئًا على منسأته فما علموا بموته إلا بعد أن أكلت دابة الأرض منسأته.\nالعبرة: الشكر على النعمة والتواضع مع الملك."], ["زكريا ويحيى عليهما السلام", "دعا زكريا ربه وهو شيخ كبير فوهب الله له يحيى.", "3,19,21", "كفل زكريا مريم، فلما رأى عندها رزقًا قال: يا مريم أنى لك هذا؟ قالت: هو من عند الله إن الله يرزق من يشاء بغير حساب. فدعا ربه أن يهب له من لدنه ذرية طيبة وقد وهن العظم منه واشتعل الرأس شيبًا وكانت امرأته عاقرًا. فنادته الملائكة وهو قائم يصلي في المحراب: أن الله يبشّرك بيحيى مصدّقًا بكلمة من الله وسيّدًا وحصورًا ونبيًّا من الصالحين. وجعل الله آيته ألّا يكلّم الناس ثلاثة أيام إلا رمزًا.\nثم قال الله ليحيى: يا يحيى خذ الكتاب بقوة، وآتاه الحكم صبيًّا وحنانًا من لدنّا وزكاة وكان تقيًّا وبرًّا بوالديه ولم يكن جبّارًا عصيًّا.\nالعبرة: الإلحاح في الدعاء واليقين بقدرة الله مهما كبر العمر."], ["قارون", "كان من قوم موسى فبغى عليهم، وآتاه الله كنوزًا فاغترّ بها فخسف الله به الأرض.", "28", "كان قارون من قوم موسى فبغى عليهم، وآتاه الله من الكنوز ما إن مفاتحه لتنوء بالعصبة أولي القوة. فقال له قومه: لا تفرح إن الله لا يحب الفرحين، وابتغِ فيما آتاك الله الدار الآخرة ولا تنسَ نصيبك من الدنيا وأحسن كما أحسن الله إليك ولا تبغِ الفساد في الأرض. فقال: إنما أوتيته على علم عندي.\nفخرج على قومه في زينته، فقال الذين يريدون الحياة الدنيا: يا ليت لنا مثل ما أوتي قارون إنه لذو حظ عظيم، وقال الذين أوتوا العلم: ويلكم ثواب الله خير لمن آمن وعمل صالحًا. فخسف الله به وبداره الأرض فما كان له من فئة ينصرونه من دون الله وما كان من المنتصرين.\nالعبرة: الاغترار بالمال والفرح به عاقبته الخسران، والفضل من الله."], ["أصحاب الفيل", "أبرهة وجيشه جاؤوا لهدم الكعبة فأهلكهم الله بطير أبابيل.", "105", "جاء أبرهة الحبشي ومعه جيش فيه فيل يريد هدم الكعبة، وكان ذلك في العام الذي وُلد فيه النبي ﷺ. فلما اقتربوا من مكة توقّف الفيل ولم يتوجه إلى الكعبة، فأرسل الله عليهم طيرًا أبابيل ترميهم بحجارة من سجّيل فجعلهم كعصف مأكول. وتحصّنت قريش في الجبال، وقال عبد المطلب: للبيت ربّ يحميه. وسُمّي ذلك العام عام الفيل.\nالعبرة: حفظ الله لبيته ونصره لعباده."], ["لقمان الحكيم", "آتاه الله الحكمة، ووعظ ابنه بوصايا جامعة.", "31", "آتى الله لقمان الحكمة أن اشكر لله. وقال لابنه وهو يعظه: يا بني لا تشرك بالله إن الشرك لظلم عظيم، يا بني إنها إن تكُ مثقال حبة من خردل فتكن في صخرة أو في السماوات أو في الأرض يأتِ بها الله إن الله لطيف خبير، يا بني أقم الصلاة وأمر بالمعروف وانهَ عن المنكر واصبر على ما أصابك إن ذلك من عزم الأمور، ولا تصعّر خدّك للناس ولا تمشِ في الأرض مرحًا، واقصد في مشيك واغضض من صوتك.\nوجاءت في السياق وصية الله بالوالدين: حملته أمه وهنًا على وهن وفصاله في عامين.\nالعبرة: التوحيد، وحسن الخلق، والإحسان إلى الوالدين."]];
mk("xt_stories","Stories of the Quran","قصص القرآن","Full stories with surah links","القصص كاملة مع روابط السور",()=>`<div class="notice">${esc(L("Tap a story to read it in full.","اضغط على القصة لقراءتها كاملة."))}</div>`+STORIES.map(([n,d,s,f])=>`<details class="card"><summary style="cursor:pointer"><b style="color:var(--primary)">${esc(n)}</b><div class="muted sm" style="margin-top:4px">${esc(d)}</div></summary><div style="margin-top:10px">${f.split("\n").map(p=>`<p style="line-height:2;margin:8px 0">${esc(p)}</p>`).join("")}</div><div class="row" style="margin-top:8px">${s.split(",").map(x=>`<button class="chip" data-d4="surah" data-v="${x}">${esc(sg(+x))}</button>`).join("")}</div></details>`).join("")+`<p class="muted sm">${esc(L("The stories are summarised from the Quran; read the surahs and their tafsir for the exact wording.","القصص ملخّصة من القرآن الكريم؛ ارجع إلى السور وتفسيرها للنص الدقيق."))}</p>`);
mk("xt_tj","Tajweed video lessons","دروس التجويد المرئية","Arabic lessons on YouTube","دروس عربية على يوتيوب",()=>["مخارج الحروف","أحكام النون الساكنة والتنوين","أحكام الميم الساكنة","المدود","القلقلة","التفخيم والترقيق","الوقف والابتداء","الإدغام","صفات الحروف"].map(x=>`<a class="card row sb" target="_blank" rel="noopener noreferrer" href="${yq("شرح "+x+" تجويد")}"><span>${x}</span><b>▶ ↗</b></a>`).join(""));
mk("xt_irab","Quran grammar (i'rab)","إعراب القرآن","Word-by-word grammar of each ayah","الإعراب والتحليل النحوي لكل آية",()=>`<div class="row">${ssel("s")}${num("a",1,286)}</div><div id="xt-o"></div>`,()=>xe("xt-o",`<a class="btn" target="_blank" rel="noopener noreferrer" href="https://corpus.quran.com/wordbyword.jsp?chapter=${XQ.s}&verse=${XQ.a}">${esc(L("Open grammar analysis ↗","فتح التحليل النحوي ↗"))}</a><p class="muted sm">${esc(L("Opens the Quranic Arabic Corpus (external site).","يفتح موقع Quranic Arabic Corpus (موقع خارجي)."))}</p>`));
/* inheritance */
function inh(o){const {sp,w,f,m,s,d}=o,hc=s+d>0,R=[],add=(n,fr)=>{if(fr>0)R.push({n,fr})};
 if(sp==="h")add("الزوج",hc?1/4:1/2);else if(sp==="w")add(w>1?"الزوجات ("+w+")":"الزوجة",hc?1/8:1/4);
 const sps=R.reduce((a,x)=>a+x.fr,0);if(m)add("الأم",hc?1/6:(sp&&f)?(1-sps)/3:1/3);if(f&&hc)add("الأب",1/6);if(!s&&d)add(d>1?"البنات ("+d+")":"البنت",d>1?2/3:1/2);
 const F=R.reduce((a,x)=>a+x.fr,0);let rem=1-F,awl=false;
 if(F>1+1e-9){R.forEach(x=>x.fr/=F);rem=0;awl=true}
 else if(rem>1e-9){if(s>0){const u=2*s+d;R.push({n:s>1?"الأبناء ("+s+")":"الابن",fr:rem*2*s/u});if(d)R.push({n:"البنات ("+d+") تعصيبًا",fr:rem*d/u})}
  else if(f){const x=R.find(z=>z.n==="الأب");if(x)x.fr+=rem;else R.push({n:"الأب (تعصيبًا)",fr:rem})}

const DCOMMON=new Set(["محمد","احمد","محمود","علي","عبد","ابو","ابي","ابن","حسن","حسين","سعد","سعيد","خالد","صالح","ياسر","ماهر","عمر","يوسف","ابراهيم","اسماعيل","مصطفى","عبدالله","عبدالرحمن","عبدالعزيز","عبدالباسط","عبدالفتاح"]);
const dTok=n=>mqNorm(String(n)).split(" ").map(w=>w.replace(/^ال/,"")).filter(w=>w.length>1);
function dMatch(a,b){
  const ta=dTok(a),tb=dTok(b);if(!ta.length||!tb.length)return false;
  const sm=ta.length<=tb.length?ta:tb,lg=ta.length<=tb.length?tb:ta;
  if(sm.length>=2&&sm.every(w=>lg.includes(w))&&(sm.length>=3||sm.some(w=>!DCOMMON.has(w))))return true;
  if(ta.length>1&&tb.length>1&&ta[0]===tb[0]&&ta[ta.length-1]===tb[tb.length-1])return true;
  const c=ta.filter(w=>tb.includes(w));
  return sm.length===1&&c.length===1&&c[0].length>=4&&!DCOMMON.has(c[0]);
}

async function rrSearch(name,kw,oid){

    const j=await xjt(u,20000);let docs=((j.response&&j.response.docs)||[]).filter(d=>{const ti=Array.isArray(d.title)?d.title.join(" "):d.title||"",cr=Array.isArray(d.creator)?d.creator.join(" "):d.creator||"";return !rrBad(ti)&&(!nm||rrNameOk(nm,ti+" "+cr))});

const DIR={l:null,k:-1};
const KMAP={murattal:["Murattal","مرتّل"],mujawwad:["Mujawwad","مجوّد"],rare:["Concerts & rare","محافل ونادر"]};
function dirBuild(){
  const n=(MQ.list||[]).length;if(DIR.l&&DIR.k===n)return DIR.l;
  const rows=[],used=new Set();
  (MQ.list||[]).forEach(r=>{
    const ms=(r.moshaf||[]).filter(m=>m.server&&m.surah_list);if(!ms.length)return;
    const kinds=new Set(ms.map(m=>kindOf(m.name)));if(kbScholar(r.name))kinds.add("rare");
    const e=EGY.findIndex(x=>egMatch(r.name,x)||dMatch(r.name,x.n));if(e>=0)used.add(e);
    rows.push({id:r.id,name:r.name,kinds,eg:e,q:QARIS.findIndex(x=>dMatch(r.name,x[1]))});
  });
  EGY.forEach((x,i)=>{if(used.has(i))return;const k=new Set();if(x.f.includes("j"))k.add("mujawwad");if(x.f.includes("r"))k.add("murattal");if(kbScholar(x.n))k.add("rare");rows.push({id:null,name:x.n,kinds:k,eg:i,q:-1})});
  DIR.l=rows;DIR.k=n;return rows;
}

/* لتظهر الحلقات والاشتراكات على كل الأجهزة: ضع هنا رابط Firebase Realtime Database المشترك (نفس خطوات صفحة «الحساب والمزامنة»).
   مثال: https://اسم-مشروعك-default-rtdb.firebaseio.com
   لو فاضي: الحلقات بتتحفظ على الجهاز ده بس. */
const HQ_URL="";
const HQT=[["fiqh","فقه","Fiqh"],["hadith","حديث","Hadith"],["seerah","سيرة","Seerah"],["quran","قرآن","Quran"],["tafsir","تفسير","Tafsir"],["tajweed","تجويد","Tajweed"],["aqeedah","عقيدة","Aqeedah"],["arabic","لغة عربية","Arabic language"],["other","أخرى","Other"]];
const hqTn=k=>{const x=HQT.find(a=>a[0]===k)||HQT[HQT.length-1];return L(x[2],x[1])};
const HQS={type:"all",minR:0,minS:0,sort:"new",q:"",fo:false,data:null,err:null,edit:null,busy:false};
const hqBase=()=>window.__CFG?"/db":String(localStorage.getItem("dawa:dburl")||HQ_URL||"").trim().replace(/\/+$/,"");
const hqRemote=()=>!!hqBase();
const hqToast=m=>{let t=document.getElementById("t4");if(!t){t=document.createElement("div");t.id="t4";t.style.cssText="position:fixed;bottom:90px;inset-inline:16px;margin:auto;max-width:420px;z-index:90;background:#111;color:#fff;padding:10px 14px;border-radius:12px;text-align:center";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>{t.hidden=true},3500)};

/* ---------- التخزين: قاعدة مشتركة (REST) أو محلي على الجهاز ---------- */
const hqPath=p=>String(p).split("/").filter(Boolean);
const hqLoc=()=>{try{return JSON.parse(localStorage.getItem("dawa:hqlocal")||"{}")||{}}catch(e){return{}}};
async function hqGet(p){
  if(hqRemote()){const r=await fetch(hqBase()+"/"+p+".json");if(!r.ok)throw new Error("DB "+r.status);return r.json()}
  let o=hqLoc();for(const k of hqPath(p)){if(o==null||typeof o!=="object")return null;o=o[k]}return o===undefined?null:o}
async function hqPut(p,v){
  if(hqRemote()){const r=await fetch(hqBase()+"/"+p+".json",v==null?{method:"DELETE"}:{method:"PUT",body:JSON.stringify(v)});if(!r.ok)throw new Error("DB "+r.status);return}
  const o=hqLoc(),a=hqPath(p);let c=o;a.slice(0,-1).forEach(k=>{if(!c[k]||typeof c[k]!=="object")c[k]={};c=c[k]});const z=a[a.length-1];if(v==null)delete c[z];else c[z]=v;localStorage.setItem("dawa:hqlocal",JSON.stringify(o))}
async function hqPatch(p,v){
  if(hqRemote()){const r=await fetch(hqBase()+"/"+p+".json",{method:"PATCH",body:JSON.stringify(v)});if(!r.ok)throw new Error("DB "+r.status);return}
  for(const k in v)await hqPut(p+"/"+k,v[k])}

/* ---------- الهوية: لازم حساب بإيميل وباسورد. المعرّف مشتق من الإيميل فيطلع نفسه على أي جهاز ---------- */
let HQU=null;
const hqSha=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return"d"+h.toString(16)}};
const hqLogged=()=>{const m=XS.g("me",null);return !!(m&&m.email&&m.u!=="device_local")};
async function hqMe(){
  const m=XS.g("me",null);if(!m||!m.email||m.u==="device_local"){HQU=null;return null}
  const em=String(m.email).trim().toLowerCase();if(HQU&&HQU.em===em)return HQU;
  const loc=em.split("@")[0].replace(/[.#$\[\]\/\s]+/g,"_").slice(0,20)||"user";
  HQU={em,uid:(window.__CFG&&m.u)?m.u:loc+"_"+(await hqSha(em)).slice(0,10),name:String(m.name||loc).slice(0,40)};return HQU}

/* ---------- أدوات ---------- */
const hqUrl=u=>{u=String(u||"").trim();if(!u)return"";if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u="https://"+u;try{const x=new URL(u);return(x.protocol==="https:"||x.protocol==="http:")&&x.hostname.includes(".")?x.href:""}catch(e){return""}};
const hqArr=v=>Array.isArray(v)?v.filter(Boolean):(v&&typeof v==="object"?Object.values(v).filter(Boolean):[]);
const hqSubs=h=>h.subs&&typeof h.subs==="object"?Object.entries(h.subs).filter(e=>e[1]):[];
const hqRates=h=>h.rates&&typeof h.rates==="object"?Object.values(h.rates).map(x=>+(x&&x.r)).filter(n=>n>=1&&n<=5):[];
const hqAvg=h=>{const r=hqRates(h);return r.length?r.reduce((a,b)=>a+b,0)/r.length:0};
const hqNum=n=>n.toLocaleString(S.lang==="ar"?"ar-EG-u-nu-latn":"en-US");
const hqStars=n=>{const k=Math.round(n);return "★".repeat(k)+"☆".repeat(5-k)};
async function hqLoad(){
  HQS.err=null;
  try{const d=await hqGet("halaqat");HQS.data=d&&typeof d==="object"?Object.values(d).filter(h=>h&&typeof h==="object"&&h.id&&h.title):[]}
  catch(e){HQS.err=e.message||"error";if(!HQS.data)HQS.data=[]}}
function hqView(){
  const q=HQS.q.trim().toLowerCase();
  const a=(HQS.data||[]).filter(h=>(HQS.type==="all"||h.type===HQS.type)&&hqAvg(h)>=HQS.minR&&hqSubs(h).length>=HQS.minS&&(!q||(String(h.title)+" "+String(h.sheikh||"")+" "+String(h.desc||"")).toLowerCase().includes(q)));
  const nw=(x,y)=>(y.at||0)-(x.at||0);
  a.sort(HQS.sort==="rate"?(x,y)=>hqAvg(y)-hqAvg(x)||hqRates(y).length-hqRates(x).length||nw(x,y):HQS.sort==="subs"?(x,y)=>hqSubs(y).length-hqSubs(x).length||nw(x,y):nw);
  return a}

async function hqDel(id){

const nlCap=s=>s.replace(/(^|[-\s])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function nlA2L(w){
  const d=w.replace(/[\u064B-\u065F\u0670\u0640]/g,"");if(NLW[d])return NLW[d];
  let pre="",x=d;if(/^ال.{2,}/.test(x)){x=x.slice(2);const f=NLA[x[0]]||"";pre=/^(t|th|d|dh|r|z|s|sh|n)$/.test(f)?"A"+f.toLowerCase()+"-":"Al-"}
  if(pre&&NLW["ال"+x])return NLW["ال"+x];
  const ch=[...x];let o="";
  ch.forEach((c,i)=>{const m=NLA[c];if(m==null){o+=c;return}
    if((c==="ا"||c==="ى")&&i>0){o+="a";return}
    o+=m;const nx=ch[i+1];if(nx&&NLA[nx]!=null&&!"اويىةأإآ".includes(c)&&!"اويىة".includes(nx))o+="a"});
  return pre+nlCap(o.replace(/aa+/g,"a"))}
function nlA2Ls(s){s=s.replace(/(^|\s)عبد\s+(?=\S)/g,"$1عبد");return s.replace(/[\u0621-\u064A\u0671-\u06D3][\u0621-\u064A\u0671-\u06D3\u064B-\u065F\u0670\u0640]*/g,nlA2L)}
const NLB=[["sh","ش"],["kh","خ"],["th","ث"],["dh","ذ"],["gh","غ"],["ch","تش"],["aa","ا"],["ee","ي"],["ii","ي"],["oo","و"],["ou","و"],["uu","و"],["b","ب"],["c","ك"],["d","د"],["f","ف"],["g","ج"],["h","ه"],["j","ج"],["k","ك"],["l","ل"],["m","م"],["n","ن"],["p","ب"],["q","ق"],["r","ر"],["s","س"],["t","ت"],["v","ف"],["w","و"],["x","كس"],["y","ي"],["z","ز"]];
const nlLook=k=>NLR[k]||(["al","as","ar","ad","at","an","az","ash"].map(p=>NLR[p+k]).find(Boolean))||"";
function nlL2A(w){
  const k=nlKeyL(w);if(NLR[k])return NLR[k];
  let x=w.toLowerCase().replace(/[^a-z]/g,"");if(!x)return w;
  let pre="";if(/^(al|el)/.test(x)&&x.length>3){pre="ال";x=x.slice(2)}else if(/^(ar|as|at|ad|an|az)/.test(x)&&x.length>4&&/[stdrnz]/.test(x[1])){pre="ال";x=x.slice(2)}

  let o="",i=0;if(/^[aeiou]/.test(x)){o="ا";i=1;if(/^[aeiou]/.test(x[1]||""))i=2}
  while(i<x.length){let hit=false;for(const [l,a] of NLB){if(x.startsWith(l,i)){o+=a;i+=l.length;hit=true;break}}if(!hit)i++}
  return pre+o}
function nlL2As(s){
  s=String(s).replace(/(^|[^A-Za-z])(abdul|abdel|abdal|abdus|abdur|abdun|abdu|abd)[\s-]+([A-Za-z][A-Za-z'’-]*)/gi,(m,p,a,b)=>{const k=nlKeyL(b),f=nlLook(k);return p+"عبد "+(f||(/^abd(ul|el|al|us|ur|un)$/i.test(a)?"ال":"")+nlL2A(b).replace(/^ال/,""))});
  return s.replace(/[A-Za-z\u00C0-\u024F][A-Za-z\u00C0-\u024F'’\-]*/g,w=>{const f=nlLook(nlKeyL(w));return f||nlL2A(w)})}
function nlTr(s,lg){return lg==="en"?nlA2Ls(String(s)):nlL2As(s)}

/* ---------- جلب أسماء اللغة المطلوبة (بالـ id) وتخزينها ---------- */
async function nlGet(u){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);try{const r=await fetch(u,{signal:ac.signal});if(!r.ok)throw new Error(r.status);const j=await r.json();if(j&&Array.isArray(j.reciters)&&j.reciters.length)return j;throw new Error("empty")}finally{clearTimeout(to)}}
async function nlLoad(lg){
  if(NL.busy[lg]||NL.n[lg])return;NL.busy[lg]=1;
  try{
    const c=store.get("nl:"+lg,null);
    if(c&&c.r&&c.t&&Date.now()-c.t<12096e5){NL.n[lg]=c;return}
    const j=await Promise.any(NLU[lg].map(nlGet)),o={t:Date.now(),r:{},m:{}};
    j.reciters.forEach(r=>{if(r&&r.id!=null){o.r[r.id]=r.name;(r.moshaf||[]).forEach(x=>{if(x&&x.id!=null)o.m[x.id]=x.name})}});
    NL.n[lg]=o;store.set("nl:"+lg,o)
  }catch(e){}finally{NL.busy[lg]=0;nlSweep(document.getElementById("main")||document.body)}}
function nlEnsure(){const lg=nlLang();if(NL.n[lg]||NL.busy[lg]||!MQ.list||!MQ.list.length)return;
  if(lg==="en"||MQ.list.some(r=>nlSc(nlFix(r.name))!=="ar"))nlLoad(lg)}

/* ---------- جدول الاستبدال (الاسم الأصلي ← الاسم باللغة المفعّلة) ---------- */
function nlBuild(){
  const lg=nlLang(),key=lg+":"+((MQ.list&&MQ.list.length)||0)+":"+(NL.n[lg]?1:0);
  if(NL.key===key)return;NL.key=key;
  const m=new Map(),nn=NL.n[lg]||{r:{},m:{}};
  const add=(src,alt)=>{src=String(src==null?"":src);if(src.length<2)return;const s=nlFix(src);let out=null;
    if(alt!=null){const a=nlFix(alt);if(nlSc(a)===lg)out=a}
    if(out==null){const sc=nlSc(s);out=(sc===lg||sc==="")?s:nlTr(s,lg)}
    if(out!==src)m.set(src,out)};
  (MQ.list||[]).forEach(r=>{add(r.name,nn.r[r.id]);(r.moshaf||[]).forEach(x=>add(x.name,nn.m[x.id]))});
  NL.map=m;
  const ks=[...m.keys()].sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  NL.re=ks.length?new RegExp(ks.join("|"),"g"):null}

/* ---------- تطبيق التحويل على الصفحة ---------- */
const NLSKIP="script,style,textarea,input,[data-nl-skip],[contenteditable],.card[data-act=\"qari\"]";
const NLSLOT="[data-nl=\"n\"],#qlist .card>b,#x-out summary>b,.card[data-act=\"qid\"]>b";
function nlNode(n,lg){
  const v=n.nodeValue;if(!v||v.length<2||!/\S/.test(v))return;
  const p=n.parentElement;if(!p||p.closest(NLSKIP))return;
  let nv=v;
  if(NL.re)nv=nv.replace(NL.re,x=>NL.map.get(x)||x);
  if(p.closest(NLSLOT)){const f=nlFix(nv),sc=nlSc(f);if(f!==nv)nv=f;if(sc&&sc!==lg&&sc!=="x")nv=nlTr(nv,lg)}
  if(nv!==v)n.nodeValue=nv}
function nlSweep(root){
  if(!root)return;nlEnsure();nlBuild();const lg=nlLang();
  if(root.nodeType===3){nlNode(root,lg);return}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),a=[];let n;while((n=w.nextNode()))a.push(n);a.forEach(x=>nlNode(x,lg))}
new MutationObserver(ms=>{const lg=nlLang();nlEnsure();nlBuild();
  for(const m of ms){if(m.type==="characterData")nlNode(m.target,lg);else m.addedNodes.forEach(n=>{if(n.nodeType===3)nlNode(n,lg);else if(n.nodeType===1)nlSweep(n)})}
}).observe(document.body,{childList:true,subtree:true,characterData:true});

xApply();

applyChrome();render();

})();
</script>

/* مشغّل التلاوة: شريط تقدّم قابل للسحب + الزمن + ±10 ثوانٍ + السرعة، لكل عناصر <audio controls> */
(function(){

  }else{r.disabled=true;r.max=0;r.value=0;r.style.setProperty("--p","0%");r.style.setProperty("--b","0%");dur.textContent=live?L("LIVE","مباشر"):"--:--"}

 ["loadstart","loadedmetadata","durationchange","timeupdate","progress","play","playing","pause","ended","waiting","stalled","canplay","seeking","seeked","emptied","error","abort","ratechange"].forEach(function(n){a.addEventListener(n,upd)});
